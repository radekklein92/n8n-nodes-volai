name: Release n8n nodes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Stage for npm 2FA approval, or publish through a configured trusted publisher
        type: choice
        required: true
        default: stage
        options:
          - stage
          - publish

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release tag matches package version
        run: |
          node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF_TYPE !== "tag" || process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Run this workflow on the matching version tag");'
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm pack --dry-run
      - name: Stage package with provenance
        if: inputs.mode == 'stage'
        run: npm stage publish --provenance --access public
        env:
          RELEASE_MODE: github-actions
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish package with provenance
        if: inputs.mode == 'publish'
        run: npm publish --provenance --access public
        env:
          RELEASE_MODE: github-actions
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
